version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
