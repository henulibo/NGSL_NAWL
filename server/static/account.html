<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的账号 · 词汇学习手册</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="account-page"><main class="account-shell"><nav class="account-nav"><a href="/">← 返回学习词表</a><button id="logout" class="light-button">退出登录</button></nav><div class="account-eyebrow" style="margin-top:32px">MY ACCOUNT</div><h1 id="account-heading">我的账号</h1><p class="account-muted" id="account-info">正在读取账号…</p><div class="account-grid"><section class="account-card"><h2>修改密码</h2><form id="password-form"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><p class="account-muted">12–128 个字符。修改后所有设备都需要重新登录。</p><button type="submit">保存新密码</button><p id="password-message" class="message" role="status"></p></form></section><section class="account-card" id="create-card" hidden><h2>创建学习账号</h2><form id="create-form"><label for="new-username">用户名</label><input id="new-username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" autocomplete="off" placeholder="3–32 位字母、数字、下划线或连字符"><label for="initial-password">初始密码</label><input id="initial-password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><p class="account-muted">请将用户名和初始密码单独告知账号使用者。</p><button type="submit">创建账号</button><p id="create-message" class="message" role="status"></p></form></section></div><section class="account-card" id="users-card" hidden><h2>账号管理</h2><p class="account-muted">停用账号或重置密码会使其现有登录失效。</p><div id="users"></div><p class="message" id="users-message" role="status"></p></section></main><dialog id="reset-dialog"><form id="reset-form"><h2 id="reset-heading">重置密码</h2><label for="reset-password">新的初始密码</label><input id="reset-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"><div class="actions"><button type="submit">确认重置</button><button type="button" id="reset-cancel">取消</button></div><p id="reset-message" class="message" role="status"></p></form></dialog><script src="/assets/offline-store.js"></script><script src="/assets/account.js"></script></body></html>
